# Parâmetros do código base do professor (Freeway) aplicados ao Breakout.
# Serve de comparação para o item (h). Não é o experimento principal.
name: ppo_breakout_baseline

env:
  env_id: ALE/Breakout-v5
  n_envs: 1
  frame_stack: 1
  frameskip: 4
  repeat_action_probability: 0.25
  terminal_on_life_loss: true
  clip_reward: true
  vec_env: dummy

ppo:
  policy: CnnPolicy
  n_steps: 2048
  batch_size: 256
  n_epochs: 10
  learning_rate: 2.5e-4
  lr_schedule: constant
  clip_range: 0.2
  clip_schedule: constant
  ent_coef: 0.0

train:
  total_timesteps: 50000
  device: auto
  checkpoint_freq: 25000
  eval_freq: 25000
